name: Cloud Video Splitter Pipeline

on:
  workflow_dispatch:
    inputs:
      videoUrl:
        description: 'URL of the video to split'
        required: true
        type: string
      contentCategory:
        description: 'Content Category'
        required: false
        default: 'Trending'
        type: string
      jobId:
        description: 'Job ID for progress tracking'
        required: true
        type: string
      userId:
        description: 'User ID'
        required: false
        default: 'creator'
        type: string
      appUrl:
        description: 'App URL for status updates'
        required: false
        default: 'https://the-viral-desk.vercel.app'
        type: string
      cloudinaryCloudName:
        description: 'Cloudinary Cloud Name'
        required: false
        type: string
      cloudinaryApiKey:
        description: 'Cloudinary API Key'
        required: false
        type: string
      cloudinaryApiSecret:
        description: 'Cloudinary API Secret'
        required: false
        type: string
jobs:
  split-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp & FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade "yt-dlp[default,curl-cffi]" requests

      - name: Run Cloud Video Processing
        env:
          VIDEO_URL: ${{ inputs.videoUrl }}
          CONTENT_CATEGORY: ${{ inputs.contentCategory }}
          JOB_ID: ${{ inputs.jobId }}
          USER_ID: ${{ inputs.userId }}
          CLOUDINARY_CLOUD_NAME: ${{ inputs.cloudinaryCloudName != '' && inputs.cloudinaryCloudName || secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ inputs.cloudinaryApiKey != '' && inputs.cloudinaryApiKey || secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ inputs.cloudinaryApiSecret != '' && inputs.cloudinaryApiSecret || secrets.CLOUDINARY_API_SECRET }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          APP_URL: ${{ inputs.appUrl != '' && inputs.appUrl || 'https://the-viral-desk.vercel.app' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/cloud_splitter.py
